# Weekly check that the published figures still match their official sources.
#
# Runs `npm run check` (schema, staleness, announced-change notices) and `npm run check:sources`
# (are our euro amounts still on the official pages?). When something needs a human, it opens —
# or comments on — one issue labelled "data-check", which GitHub emails to the repo owner. When
# everything is clean again it closes that issue. It never edits the data itself.
name: Weekly data check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (08:00 Brussels summer time)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Run checks
        id: run
        run: |
          set +e
          npm run --silent check > check.txt 2>&1; echo "check_exit=$?" >> "$GITHUB_OUTPUT"
          npm run --silent check:sources > sources.txt 2>&1
          cat check.txt sources.txt

          # A lapsed certificate makes browsers show "Your connection is not private" in place of
          # the site, which is what visitors of other benefit sites have run into. Cloudflare renews
          # ours automatically about a month before expiry, so fewer than 21 days left means
          # renewal has failed (a CAA record, a DNS change). Same if no certificate is returned.
          : > cert.txt
          for h in belgiumbenefits.be www.belgiumbenefits.be; do
            end=$(echo | openssl s_client -servername "$h" -connect "$h:443" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -z "$end" ]; then echo "[CERT] $h: no valid certificate returned" >> cert.txt; continue; fi
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            if [ "$days" -lt 21 ]; then echo "[CERT] $h: certificate expires in $days days ($end)" >> cert.txt; fi
          done
          cat cert.txt

          # Coverage gaps ("no results: …") are known and permanent until new entries are written,
          # and the German-speaking Community's site blocks automated requests; neither is news.
          # What is news: an amount gone from its source page, an entry past its re-check date, an
          # announced change whose fate needs checking, or a data error.
          attention=$( { cat cert.txt; grep -E '\[REVIEW' sources.txt; grep -E 'warn .*(last verified|notice announced)|ERROR' check.txt; } )
          {
            echo 'report<<EOF'
            echo "$attention"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.run.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-check --color D93F0B --description "Weekly data check" 2>/dev/null || true
          existing=$(gh issue list --label data-check --state open --json number --jq '.[0].number')
          if [ -n "$REPORT" ]; then
            body=$(printf 'These need a look by hand — compare each against its official page, then update `benefits.json` and its `verified` date.\n\n```\n%s\n```\n\nFull output: %s' "$REPORT" "$RUN_URL")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "Data check: figures to re-verify" --label data-check --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All clear on $(date -u +%F). $RUN_URL"
          fi

      - name: Fail on data errors
        if: steps.run.outputs.check_exit != '0'
        run: exit 1
